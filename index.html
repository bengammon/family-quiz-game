<body>
<title>Family Quiz Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one bright "sweet shop" column. Each question is a candy card in its topic's colour; answers are chunky sweets below.
   Light only, by design: the game stays bright at any time of day. Every text colour pair is checked to WCAG AA (4.5:1). */
:root{
  color-scheme:light;
  --bg:#FFF6FA; --card:#FFFFFF; --ink:#2B1B4A; --muted:#5B4B78; --line:#E2D6EE; --edge:#8C7FA6;
  --pop:#FFD84D; --pop-edge:#D9A800; --cream:#FFF0B3;
  --good-bg:#C9F5DA; --good-ink:#0B3A20; --good:#157A45;
  --bad-bg:#FFD3D3; --bad-ink:#6B0F0F; --bad:#C62828;
  --fade-bg:#F1ECF6;
  --gk:#8DB8FF; --gk-ink:#0B2357; --geo:#57DCC9; --geo-ink:#04332C; --mus:#FF9EC2; --mus-ink:#4A0A24;
  --sci:#9BE06A; --sci-ink:#173A06; --mat:#FFB862; --mat-ink:#4A2500; --dis:#C9AEFF; --dis-ink:#2A0E66;
  --o1:#FF9EC2; --o2:#FFD84D; --o3:#C9AEFF; --o4:#8EE6B4;
  --t1:#C2185B; --t2:#5B2FC7; --t3:#0B7A6E;
  --hand:#2B1B4A; --minute:#D6336C;
  --display:"Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 28px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1;font-weight:600}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{border:0;border-radius:18px;padding:14px 18px;font-family:var(--display);font-weight:600;min-height:54px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:1.1rem}
.btn-main{background:var(--pop);color:var(--ink);font-size:1.3rem;box-shadow:0 5px 0 var(--pop-edge)}
.btn-main:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pop-edge)}
.btn-ghost{background:var(--card);border:2px solid var(--edge);color:var(--ink)}
.btn-small{min-height:42px;padding:8px 14px;font-size:1rem;border-radius:14px}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.note{font-size:.92rem;color:var(--muted);margin:0}
.err{color:var(--bad);font-weight:700;margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--t2);text-decoration:underline;font-size:.92rem}

/* Setup */
.hero{padding-block:14px 0;display:flex;flex-direction:column;gap:8px}
.hero h1{font-size:clamp(2.5rem, 12vw, 3.6rem);font-weight:700;letter-spacing:-.01em;line-height:1}
.hero h1 .w1{color:var(--t1)} .hero h1 .w2{color:var(--t2)} .hero h1 .w3{color:var(--t3)}
.hero p{margin:0;color:var(--muted);max-width:34ch}
.sweets{font-size:1.6rem;letter-spacing:.2em}
.panel{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line)}
.panel h2{font-size:1.35rem}
.prow,.phead{display:grid;grid-template-columns:52px minmax(0,1fr) 72px 40px;gap:8px;align-items:center}
.av{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);background:var(--cream);font-size:28px;line-height:1;display:grid;place-items:center;padding:0}
.av[aria-expanded="true"]{border-color:var(--ink)}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px;background:var(--fade-bg);border-radius:18px;padding:10px}
.avgrid button{height:48px;border-radius:14px;border:2px solid transparent;background:var(--card);font-size:26px;line-height:1;padding:0}
.avgrid button[aria-pressed="true"]{border-color:var(--ink);background:var(--cream)}
.avgrid button:disabled{opacity:.35;cursor:default}
.field{width:100%;min-width:0;border:2px solid var(--edge);background:var(--card);border-radius:14px;padding:10px 12px;min-height:50px}
.field::placeholder{color:var(--muted);opacity:1}
.field:focus{border-color:var(--ink);outline:none}
.rm{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.5rem;line-height:1}
.rm:hover{background:var(--fade-bg)}
.rm:disabled{visibility:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px dashed var(--edge);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:600;font-size:1.02rem;min-height:46px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{border:2px solid var(--ci);background:var(--c);color:var(--ci)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:2px solid var(--edge);background:var(--card);border-radius:14px;min-height:50px;font-family:var(--display);font-weight:700;font-size:1.2rem}
.seg button[aria-pressed="true"]{background:var(--pop);border-color:var(--ink)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:58px;height:34px;border-radius:999px;border:2px solid var(--edge);background:var(--fade-bg);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--edge);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--good);border-color:var(--good)}
.switch[aria-checked="true"]::after{transform:translateX(24px);background:var(--card)}

/* Play */
.bar{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.scores{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.sc{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 5px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.95rem}
.sc .a{font-size:1.25rem;line-height:1}
.sc b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.sc.on{background:var(--pop);border-color:var(--ink)}
.card{background:var(--c);color:var(--ci);border-radius:28px;padding:18px 18px 22px;display:flex;flex-direction:column;gap:12px;animation:pop .35s ease-out}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{background:var(--card);color:var(--ci);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:600;font-size:.95rem}
.count{font-size:.92rem;font-weight:700;font-variant-numeric:tabular-nums}
.turn{font-size:1.6rem;display:flex;align-items:center;gap:10px}
.turn .a{font-size:2.1rem;line-height:1}
.pic{display:flex;justify-content:center}
.pic svg{width:min(230px, 66vw);height:auto;max-width:100%}
.pic .flag{width:min(250px, 70vw);border-radius:8px;box-shadow:0 0 0 3px var(--card)}
.emoji{font-size:clamp(3.2rem, 16vw, 4.6rem);line-height:1.15;text-align:center;letter-spacing:.06em;background:var(--card);border-radius:22px;padding:8px 0}
.q{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem, 6vw, 1.9rem);line-height:1.2;margin:0;text-wrap:balance}
.answers{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;border:3px solid transparent;color:var(--ink);
  border-radius:20px;padding:10px 14px 10px 10px;min-height:64px;font-family:var(--display);font-size:1.2rem;font-weight:600;box-shadow:0 4px 0 rgba(43,27,74,.18)}
.opt:nth-child(1){background:var(--o1)} .opt:nth-child(2){background:var(--o2)} .opt:nth-child(3){background:var(--o3)} .opt:nth-child(4){background:var(--o4)}
.opt .k{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;background:var(--card);color:var(--ink)}
.opt .m{font-size:1.4rem;font-weight:700}
.opt:not([disabled]):active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,27,74,.18)}
.opt.ok{background:var(--good-bg);border-color:var(--good);color:var(--good-ink)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad-ink)}
.opt.dim{background:var(--fade-bg);color:var(--muted);box-shadow:none}
.opt[disabled]{cursor:default}
.reveal{background:var(--card);border:3px dashed var(--edge);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.reveal .ans{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.15}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-ok{background:var(--o4);color:var(--good-ink);box-shadow:0 5px 0 #4FBF85;font-size:1.25rem}
.btn-no{background:#FF9E9E;color:var(--bad-ink);box-shadow:0 5px 0 #E06B6B;font-size:1.25rem}
.btn-ok:active,.btn-no:active{transform:translateY(3px)}
.result{border-radius:18px;padding:12px 16px;font-family:var(--display);font-weight:600;font-size:1.2rem}
.result.ok{background:var(--good-bg);color:var(--good-ink)}
.result.no{background:var(--bad-bg);color:var(--bad-ink)}
.tools{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{margin:0;color:var(--muted)}
.ico{width:20px;height:20px;flex:none}

/* End */
.trophy{font-size:4.5rem;line-height:1;text-align:center;animation:pop .5s ease-out}
.endh{text-align:center;font-size:clamp(2rem, 9vw, 2.8rem);font-weight:700;color:var(--t2)}
.podium{display:flex;flex-direction:column;gap:10px}
.rank{display:grid;grid-template-columns:40px 44px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px}
.rank .pos{font-family:var(--display);font-weight:700;font-size:1.4rem;text-align:center;color:var(--muted)}
.rank .a{font-size:2rem;line-height:1;text-align:center}
.rank.first{border-color:var(--ink);background:var(--cream)}
.rank.first .pos{color:var(--ink)}
.rank .nm{font-family:var(--display);font-weight:600;font-size:1.2rem}
.rank .st{font-size:.9rem;color:var(--muted)}
.rank .pts{font-family:var(--display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Pictures drawn in the page */
.clock-face{fill:#FFFFFF;stroke:var(--hand);stroke-width:6}
.clock-num{fill:var(--hand);font-family:var(--display);font-weight:700;font-size:19px}
.clock-tick{stroke:var(--hand);stroke-width:2}
.clock-h{stroke:var(--hand);stroke-width:9;stroke-linecap:round}
.clock-m{stroke:var(--minute);stroke-width:6;stroke-linecap:round}
.clock-c{fill:var(--hand)}
.shape{fill:#FFFFFF;stroke:var(--ci, var(--ink));stroke-width:7;stroke-linejoin:round}

/* Effects */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top, 0px) + 18px);transform:translate(-50%,-30px) scale(.9);opacity:0;z-index:60;pointer-events:none;
  background:var(--ink);color:#FFFFFF;font-family:var(--display);font-weight:600;font-size:1.35rem;padding:12px 22px;border-radius:999px;transition:opacity .2s, transform .25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.shake{animation:shake .45s}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>

/* Pick the closest-difficulty unseen question from a pool */
function pickFrom(pool,target,used){
  let near=pool.filter(q=>Math.abs(q.d-target)<=1.1&&!used.has(q.id));
  let fresh=near.filter(q=>!seen.has(q.id));
  if(!fresh.length&&near.length){near.forEach(q=>seen.delete(q.id));saveSeen();fresh=near;}
  if(!fresh.length) fresh=pool.filter(q=>!used.has(q.id));
  if(!fresh.length) fresh=pool;
  const best=fresh.filter(q=>Math.abs(q.d-target)<=0.6);
  return pick(best.length?best:fresh);
}

  let s=`<svg viewBox="0 0 200 200" role="img" aria-label="A clock face"><circle class="clock-face" cx="100" cy="100" r="92"/>`;
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?84:80,r2=88;s+=`<line class="clock-tick" x1="${100+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${100+r2*Math.sin(a)}" y2="${100-r2*Math.cos(a)}"/>`;}
  for(let n=1;n<=12;n++){const a=n*30*Math.PI/180;s+=`<text class="clock-num" x="${100+67*Math.sin(a)}" y="${100-67*Math.cos(a)+7}" text-anchor="middle">${n}</text>`;}
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  s+=`<line class="clock-h" x1="100" y1="100" x2="${100+44*Math.sin(ha)}" y2="${100-44*Math.cos(ha)}"/>`;
  s+=`<line class="clock-m" x1="100" y1="100" x2="${100+70*Math.sin(ma)}" y2="${100-70*Math.cos(ma)}"/><circle class="clock-c" cx="100" cy="100" r="6"/></svg>`;
  return s;
}
function genClock(l){
  const h=R(1,12);
  let m = l<=1?0 : l===2?pick([0,30,30]) : l===3?pick([15,30,45]) : pick([5,10,20,25,35,40,50,55]);
  if(l>=5) m=R(0,11)*5;
  let ah=h,am=m,q="What time does this clock show?",say;
  if(l>=5){const add=pick([20,25,35,40,45,50]);const tot=h*60+m+add;ah=Math.floor(tot/60);am=tot%60;q=`What time will it be ${add} minutes after the time on this clock?`;}
  const ans=timePhrase(ah,am);
  const cands=[[ah+1,am],[ah-1,am],[ah,(am+30)%60],[ah,(am+15)%60],[ah,(am+45)%60],[ah+2,am]];
  if(am%5===0){cands.unshift([am===0?12:am/5,((ah%12)*5)%60]);}
  const w=[...new Set(shuffle(cands).map(c=>timePhrase(c[0],c[1])))].filter(x=>x!==ans).slice(0,3);
  return {id:"clock:"+h+":"+m+":"+l,cat:"mat",d:l,q,a:ans,w,svg:clockSVG(h,m)};
}
const SHAPES=[[3,"Triangle",1],[4,"Square",1],[0,"Circle",1],[5,"Pentagon",2],[6,"Hexagon",2],[8,"Octagon",3],[7,"Heptagon",4],[10,"Decagon",5],[9,"Nonagon",5]];
function shapeSVG(n){
  if(!n) return `<svg viewBox="0 0 200 200" role="img" aria-label="A shape"><circle class="shape" cx="100" cy="100" r="80"/></svg>`;
  const pts=[];for(let i=0;i<n;i++){const a=(i/n)*2*Math.PI+Math.PI/n+Math.PI/2;pts.push(`${100+82*Math.cos(a)},${104+82*Math.sin(a)}`);}
  return `<svg viewBox="0 0 200 200" role="img" aria-label="A shape"><polygon class="shape" points="${pts.join(" ")}"/></svg>`;
}
function genShape(l){
  const ok=SHAPES.filter(s=>s[2]<=l&&s[2]>=l-2);
  const s=pick(ok.length?ok:SHAPES);
  const askSides=s[0]>0&&l>=2&&Math.random()<.5;
  if(askSides){const n=s[0];return {id:"shape:s"+n,cat:"mat",d:l,q:"How many sides does this shape have?",a:String(n),w:shuffle([n-1,n+1,n+2].map(String)),svg:shapeSVG(n)};}
  const others=shuffle(SHAPES.filter(x=>x!==s&&Math.abs(x[2]-s[2])<=2)).slice(0,3).map(x=>x[1]);
  return {id:"shape:n"+s[1],cat:"mat",d:l,q:"What is the name of this shape?",a:s[1],w:others,svg:shapeSVG(s[0]),mc:l<=2};
}
function genFlag(target,used){
  const f=pickFrom(FLAGPOOL,target,used);
  const others=shuffle(FLAGPOOL.filter(x=>x!==f&&Math.abs(x.d-f.d)<=1)).slice(0,3).map(x=>x.a);
  return {...f,w:others,svg:flagSVG(f.spec)};
}

/* ---------- Speech ---------- */
const Speech={ok:"speechSynthesis" in window,voice:null,
  init(){ if(!this.ok) return; const choose=()=>{const v=speechSynthesis.getVoices();
      this.voice=v.find(x=>/en[-_]GB/i.test(x.lang)&&/(sonia|libby|serena|kate|martha|female|google uk english female)/i.test(x.name))
        ||v.find(x=>/en[-_]GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;};
    choose(); speechSynthesis.onvoiceschanged=choose; },
  say(parts,delay=80){ if(!this.ok||!setup.voice) return; speechSynthesis.cancel();
    const list=(Array.isArray(parts)?parts:[parts]).filter(Boolean).map(speakable);
    clearTimeout(this.tm);
    this.tm=setTimeout(()=>{list.forEach(p=>{const u=new SpeechSynthesisUtterance(p);if(this.voice)u.voice=this.voice;u.lang="en-GB";u.rate=.95;speechSynthesis.speak(u);});},delay); },
  stop(){ if(this.ok){clearTimeout(this.tm);speechSynthesis.cancel();} }
};
/* Dates like "25th December" (or "25 December") are spoken as "the twenty-fifth of December". Speech engines
   read day numbers inconsistently ("24th December" then "25 December"), so the words are spelled out. */
const DATE_RE=/\b([1-9]|[12]\d|3[01])(?:st|nd|rd|th)? (January|February|March|April|May|June|July|August|September|October|November|December)\b/g;
function ordinalWord(n){
  const w=["","first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth","eleventh","twelfth","thirteenth",
    "fourteenth","fifteenth","sixteenth","seventeenth","eighteenth","nineteenth","twentieth"];
  if(n<=20) return w[n];
  if(n===30) return "thirtieth";
  return (n<30?"twenty-":"thirty-")+w[n%10];
}
function speakable(t){
  const fr={"1/2":"a half","1/4":"a quarter","3/4":"three quarters","1/3":"a third","2/3":"two thirds","2/5":"two fifths","3/5":"three fifths","1/8":"an eighth","5/8":"five eighths","1/25":"one twenty-fifth"};
  return String(t)
    .replace(DATE_RE,(m,d,mon)=>`the ${ordinalWord(+d)} of ${mon}`)
    .replace(/\b(\d)\/(\d+)\b/g,m=>fr[m]||m)
    .replace(/×/g," times ").replace(/÷/g," divided by ").replace(/(\d)\s*−\s*(\d)/g,"$1 minus $2").replace(/−/g," minus ")
    .replace(/(\d+)p\b/g,"$1 pence").replace(/\bH2O\b/g,"H 2 O").replace(/\bCO2\b/g,"C O 2").replace(/\bO2\b/g,"O 2")
    .replace(/&/g," and ").replace(/221B/g,"2 2 1 B").replace(/4\/4/g,"four four");
}

/* ---------- Sound effects (synthesised in the browser: free, no files, works offline) ---------- */
const Sfx={ctx:null,
  ensure(){ if(!setup.sound) return null;
    try{ if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C();}
      if(this.ctx.state==="suspended") this.ctx.resume(); return this.ctx; }catch(e){ return null; } },
  tone(f,start,dur,type,vol,f2){ const c=this.ensure(); if(!c) return;
    const t=c.currentTime+start,o=c.createOscillator(),g=c.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.18,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.05); },
  right(){ [[784,0],[988,.09],[1319,.18]].forEach(([f,s])=>this.tone(f,s,.3,"triangle",.2)); },
  wrong(){ this.tone(330,0,.5,"sine",.25,110); },
  streak(){ [1047,1319,1568,2093].forEach((f,i)=>this.tone(f,.35+i*.07,.22,"sine",.12)); },
  win(){ [[523,0],[659,.15],[784,.3],[1047,.45],[784,.62],[1047,.75]].forEach(([f,s],i)=>this.tone(f,s,i===5?.7:.2,"square",.07)); },
  pop(){ this.tone(520,0,.08,"sine",.1,880); }
};

/* ---------- Confetti, shakes and pop-up messages ---------- */
const Fx={canvas:null,parts:[],running:false,
  reduced(){ return matchMedia("(prefers-reduced-motion: reduce)").matches; },
  burst(n){ if(this.reduced()) return;
    if(!this.canvas){const c=document.createElement("canvas");c.className="confetti";c.setAttribute("aria-hidden","true");document.body.appendChild(c);this.canvas=c;}
    const c=this.canvas,dpr=window.devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr;
    const cols=["#FF9EC2","#FFD84D","#C9AEFF","#8EE6B4","#57DCC9","#FFB862","#8DB8FF","#C2185B"];
    for(let i=0;i<(n||70);i++) this.parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.3,vx:(Math.random()-.5)*10,vy:-Math.random()*10-4,
      s:Math.random()*7+6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(cols),life:0,round:Math.random()<.3});
    if(!this.running){this.running=true;requestAnimationFrame(()=>this.step());} },
  step(){ const c=this.canvas,x=c.getContext("2d"),dpr=window.devicePixelRatio||1;
    x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,innerWidth,innerHeight);
    this.parts=this.parts.filter(p=>p.y<innerHeight+30&&p.life<260);
    for(const p of this.parts){ p.life++; p.vy+=.25; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c;
      if(p.round){x.beginPath();x.arc(0,0,p.s/2.4,0,Math.PI*2);x.fill();} else x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);
      x.restore(); }
    if(this.parts.length) requestAnimationFrame(()=>this.step()); else {this.running=false;x.clearRect(0,0,innerWidth,innerHeight);} },
  shake(){ if(this.reduced()) return; const el=document.querySelector(".card"); if(!el) return;
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
};
function toast(text){
  let t=document.querySelector(".toast");
  if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=text; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  clearTimeout(toast.tm); toast.tm=setTimeout(()=>t.classList.remove("show"),1900);
}

const AVATARS=[["🦊","fox"],["🐻","bear"],["🐼","panda"],["🦄","unicorn"],["🐸","frog"],["🐯","tiger"],["🐵","monkey"],["🐰","rabbit"],
  ["🐨","koala"],["🦁","lion"],["🐙","octopus"],["🐧","penguin"],["🐶","dog"],["🐱","cat"],["🦖","dinosaur"],["🐢","turtle"],["🦉","owl"],["🐝","bee"]];

const DEFAULT_SETUP={players:[{name:"",age:"",av:"🦊"},{name:"",age:"",av:"🐻"}],cats:Object.keys(CATS),per:5,voice:true,sound:true};
let setup=Object.assign({},DEFAULT_SETUP,store.get("pr_setup_v1",{}));
function freeAvatar(except){const used=new Set(setup.players.filter((p,i)=>i!==except).map(p=>p.av));return (AVATARS.find(a=>!used.has(a[0]))||AVATARS[0])[0];}
/* Fills gaps in settings saved by older versions (e.g. players with no animal yet). Runs on load and after a live update. */
function normalizeSetup(){
  if(!Array.isArray(setup.players)||!setup.players.length) setup.players=DEFAULT_SETUP.players.map(p=>({...p}));
  setup.players.forEach((p,i)=>{ if(!AVATARS.some(a=>a[0]===p.av)) p.av=freeAvatar(i); });
  if(typeof setup.sound!=="boolean") setup.sound=true;
  if(typeof setup.voice!=="boolean") setup.voice=true;
  if(!Array.isArray(setup.cats)) setup.cats=Object.keys(CATS);
  if(state&&Array.isArray(state.players)) state.players.forEach((p,i)=>{ if(!AVATARS.some(a=>a[0]===p.av)){
    const m=setup.players.find(s=>s.name.trim()===p.name); p.av=m?m.av:AVATARS[i%AVATARS.length][0]; } });
}
let state=null;      // the running game
let ui={error:"",quitArm:false,pickFor:null};
const saveSetup=()=>store.set("pr_setup_v1",setup);
normalizeSetup(); saveSetup();

function startRating(age){
  age=parseInt(age,10); if(!age) return 3;
  if(age<=6) return 1; if(age<=8) return 1.4; if(age<=10) return 1.9; if(age<=12) return 2.4;
  if(age<=15) return 2.9; if(age<=17) return 3.3; return 3.5;
}
const cur=()=>state.players[state.turn%state.players.length];
const posName=n=>n+(/s$/i.test(n)?"'":"'s");

function startGame(){
  const players=setup.players.map(p=>({name:p.name.trim(),age:p.age,av:p.av})).filter(p=>p.name);
  if(!players.length){ui.error="Add at least one player's name to start.";render();return;}
  if(!setup.cats.length){ui.error="Pick at least one topic.";render();return;}
  ui.error=""; ui.pickFor=null;
  state={players:players.map(p=>({...p,score:0,r:startRating(p.age),streak:0,best:0,answered:0,lastCat:null})),
    total:players.length*setup.per,turn:0,used:[],q:null,mode:null,opts:[],phase:"ask",picked:null,screen:"play"};
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{});}catch(e){}
  Sfx.pop();
  nextQuestion(true);
}

function nextQuestion(first,prefix,delay){
  const p=cur(), used=new Set(state.used);
  const cats=setup.cats.length>1?setup.cats.filter(c=>c!==p.lastCat):setup.cats;
  const cat=pick(cats); p.lastCat=cat;
  const target=clamp(p.r+(Math.random()-.5)*.9,1,5), lvl=Math.round(target);
  let q=null;
  if(cat==="mat"){const x=Math.random(); if(x<.42) q=genArith(lvl); else if(x<.62) q=genClock(lvl); else if(x<.72) q=genShape(lvl);}
  if(cat==="geo"&&Math.random()<.28) q=genFlag(target,used);
  if(!q) q=pickFrom(POOLS[cat],target,used);
  state.used.push(q.id); seen.add(q.id); saveSeen();
  const mcChance=p.r<2.5?.6:.45;
  state.q={...q}; state.mode=(q.mc||Math.random()<mcChance)?"mc":"open";
  state.opts=shuffle([q.a,...q.w]); state.phase="ask"; state.picked=null; state.feedback=null;
  render(); window.scrollTo(0,0); readQuestion(prefix,delay);
}

/* ---------- The host's lines ----------
   Each moment has several ways of saying it. {name}, {a}, {cat}, {n} and {pts} are filled in.
   The host never uses the same line twice in a row for the same moment. */
const LINES={
  turn:["{name}, you're up next.","Over to you, {name}!","Your turn, {name}!","Here's one for you, {name}.","Next up, it's {name}!",
    "Ready, {name}? Here we go.","{name}, this one's all yours.","Right then, {name}, let's see what you know.","Okay {name}, put your thinking cap on."],
  cat:["{cat}.","This one's {cat}.","Time for some {cat}.","It's a {cat} question.","Let's have some {cat}."],
  look:["Have a look at the picture.","Take a good look at this.","Look closely."],
  options:["Is it {list}?","Your choices are {list}.","Is it {list}? Have a think."],
  right:["Correct! Well done, {name}.","Yes! Brilliant, {name}!","That's right! Nice one.","Spot on, {name}!","Smashed it!","Ooh, very good!",
    "Top marks, {name}!","That's the one!","Correct! Clever clogs.","Nailed it, {name}!"],
  wrong:["Not quite. The answer is {a}.","Oh, so close! It was {a}.","Unlucky, {name}. The answer is {a}.","Ooh, not this time. It's {a}.",
    "Good try! The right answer is {a}.","Oh no! It was {a}."],
  reveal:["The answer is {a}.","And the answer is... {a}!","It's {a}!","Drum roll please... {a}!","The answer we were looking for is {a}."],
  judgeRight:["Point to {name}!","Nice one, {name}!","Well done, {name}!","A point for {name}!","Great answer, {name}!"],
  judgeWrong:["Never mind, {name}.","Unlucky, {name}.","Better luck next time, {name}.","Oh well, {name}. The next one's yours.","So close, {name}."],
  streak:["That's {n} in a row!","{n} in a row! You're on fire!","Wow, {n} in a row!","{n} in a row. Unstoppable!"],
  skip:["Let's try a different one.","Okay, here's another one.","No problem. New question!"],
  half:["We're halfway there!","Halfway through the quiz!"],
  last:["Last question!","Here comes the very last question!","This is the final question!"],
  end:["That's the end of the game!","And that was the last question!","Pencils down, that's the game!"],
  win:["And the winner is {name}, with {pts}! Well played, everyone.","{name} wins with {pts}! What a game!","Congratulations, {name}! You win with {pts}.","Hooray for {name}, our champion, with {pts}!"],
  draw:["It's a draw between {name}, with {pts} each!","We have a tie! {name} share the crown with {pts} each!"]
};
const lastLine={};
function line(key,vars){
  const opts=LINES[key], prev=lastLine[key];
  let pickd=pick(opts); if(opts.length>1) while(pickd===prev) pickd=pick(opts);
  lastLine[key]=pickd;
  return pickd.replace(/\{(\w+)\}/g,(m,k)=>vars&&vars[k]!=null?vars[k]:"");
}
const orList=o=>`${o.slice(0,-1).join(", ")}, or ${o[o.length-1]}`;

function readQuestion(prefix,delay){
  const p=cur(),q=state.q,parts=[];
  if(prefix) parts.push(prefix);
  if(state.turn===state.total-1&&state.total>2) parts.push(line("last"));
  else if(state.total>=8&&state.turn===state.total/2) parts.push(line("half"));
  parts.push(line("turn",{name:p.name}));
  parts.push(line("cat",{cat:CATS[q.cat].name}));
  if(q.e||q.svg) parts.push(line("look"));
  parts.push(q.say||q.q);
  if(state.mode==="mc") parts.push(line("options",{list:orList(state.opts)}));
  Speech.say(parts,delay);
}

/* Records the answer and plays the matching sound and effects. Returns the streak length when it's worth a mention. */
function score(correct){
  const p=cur(); p.answered++;
  if(correct){
    p.score++; p.streak++; p.best=Math.max(p.best,p.streak); p.r=clamp(p.r+.4,1,5);
    Sfx.right(); Fx.burst(p.streak>=3?110:60);
    if(p.streak>=3){ Sfx.streak(); toast(`${p.av} ${p.streak} in a row! 🔥`); return p.streak; }
  } else { p.streak=0; p.r=clamp(p.r-.5,1,5); Sfx.wrong(); }
  return 0;
}
function advance(prefix,delay){
  state.turn++;
  if(state.turn>=state.total){endGame(prefix);return;}
  nextQuestion(false,prefix,delay);
}
function endGame(prefix){
  state.screen="end"; render(); window.scrollTo(0,0);
  const ps=state.players.slice().sort((a,b)=>b.score-a.score), top=ps[0].score, winners=ps.filter(p=>p.score===top);
  const pts=n=>n===1?"1 point":`${n} points`;
  let verdict;
  if(state.players.length===1) verdict=`You scored ${pts(top)} out of ${state.total}. ${top>0?"Nice work, "+ps[0].name+"!":"Have another go!"}`;
  else if(winners.length===1) verdict=line("win",{name:winners[0].name,pts:pts(top)});
  else verdict=line("draw",{name:winners.map(w=>w.name).join(" and "),pts:pts(top)});
  Sfx.win(); Fx.burst(180); setTimeout(()=>Fx.burst(120),700);
  Speech.say([prefix,line("end"),verdict],1100);
}

  <section class="panel" aria-labelledby="h-topics">
    <h2 id="h-topics">Topics</h2>
    <div class="chips">${Object.entries(CATS).map(([k,c])=>`<button class="chip" data-a="cat" data-c="${k}" style="${catVars(k)}" aria-pressed="${setup.cats.includes(k)}"><span aria-hidden="true">${c.icon}</span>${c.name}</button>`).join("")}</div>
  </section>
  <section class="panel" aria-labelledby="h-len">
    <h2 id="h-len">Questions each</h2>
    <div class="seg" role="group" aria-labelledby="h-len">${[3,5,8,10,12].map(v=>`<button data-a="per" data-v="${v}" aria-pressed="${setup.per===v}">${v}</button>`).join("")}</div>
    <p class="note" id="mins">${minutesNote()}</p>
    <div class="toggle"><div><strong>Read questions aloud</strong>${Speech.ok?"":`<p class="note">This browser can't read aloud.</p>`}</div>
      <button class="switch" role="switch" data-a="voice" aria-checked="${setup.voice}" aria-label="Read questions aloud"></button></div>
    <div class="toggle"><strong>Sound effects</strong>
      <button class="switch" role="switch" data-a="sound" aria-checked="${setup.sound}" aria-label="Sound effects"></button></div>
  </section>
  ${ui.error?`<p class="err" role="alert">${esc(ui.error)}</p>`:""}
  <button class="btn btn-main" data-a="start">Start the quiz 🎉</button>
  <p class="note" style="text-align:center">${BANK_COUNT} questions, plus endless sums, clocks and shapes. Questions you've had are kept back until you've seen the rest.
    <br><button class="linkbtn" data-a="resetseen">Forget which questions we've had</button></p>`;
}

function scoresHTML(){
  return `<div class="scores">${state.players.map((p,i)=>`<span class="sc ${state.screen==="play"&&i===state.turn%state.players.length?"on":""}">
    <span class="a" aria-hidden="true">${p.av}</span>${esc(p.name)} <b>${p.score}</b>${p.streak>=3?` <span aria-label="${p.streak} in a row">🔥</span>`:""}</span>`).join("")}</div>`;
}

function renderPlay(){
  const p=cur(),q=state.q,cat=q.cat;
  let pic="";
  if(q.svg) pic=`<div class="pic">${q.svg}</div>`;
  else if(q.e) pic=`<div class="emoji" aria-hidden="true">${q.e}</div>`;
  let body="";
  if(state.mode==="mc"){
    body=state.opts.map((o,i)=>{
      let cls="",mark="";
      if(state.phase==="done"){ if(o===q.a){cls="ok";mark="✓";} else if(i===state.picked){cls="no";mark="✗";} else cls="dim"; }
      return `<button class="opt ${cls}" data-a="opt" data-i="${i}" ${state.phase==="done"?"disabled":""}><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span><span class="m" aria-hidden="true">${mark}</span></button>`;}).join("");
    if(state.phase==="done"){
      const right=state.opts[state.picked]===q.a;
      body+=`<div class="result ${right?"ok":"no"}" role="status">${esc(state.feedback||(right?"Correct!":`It's ${q.a}.`))}${right?" 🎉":""}</div>
        <button class="btn btn-main" data-a="next">${state.turn+1>=state.total?"See the scores 🏆":`Next: ${state.players[(state.turn+1)%state.players.length].av} ${esc(state.players[(state.turn+1)%state.players.length].name)}`}</button>`;
    }
  } else {
    if(state.phase==="ask"){
      body=`<p class="hint">Say your answer out loud, then show the answer.</p><button class="btn btn-main" data-a="reveal">Show answer 👀</button>`;
    } else {
      body=`<div class="reveal"><span class="label">Answer</span><span class="ans">${esc(q.a)}</span></div>
        <p class="hint">Everyone decides: did ${esc(p.name)} get it?</p>
        <div class="judge"><button class="btn btn-ok" data-a="judge" data-v="1">✓ Got it</button><button class="btn btn-no" data-a="judge" data-v="0">✗ Missed it</button></div>`;
    }
  }
  $app.innerHTML=`
  <header class="bar">${scoresHTML()}<button class="btn btn-ghost btn-small" data-a="quit">${ui.quitArm?"Tap again to end":"End game"}</button></header>
  <main class="card" style="${catVars(cat)}">
    <div class="meta"><span class="tag"><span aria-hidden="true">${CATS[cat].icon}</span> ${CATS[cat].name}</span><span class="count">Question ${state.turn+1} of ${state.total}</span></div>
    <h2 class="turn"><span class="a" aria-hidden="true">${p.av}</span>${esc(posName(p.name))} turn!</h2>
    ${pic}
    <p class="q">${esc(q.q)}</p>
  </main>
  <section class="answers" aria-label="Answers">${body}</section>
  <div class="tools">
    ${Speech.ok&&setup.voice?`<button class="btn btn-ghost btn-small" data-a="say">${ICON_SPEAK} Read again</button>`:"<span></span>"}
    ${state.phase!=="done"?`<button class="btn btn-ghost btn-small" data-a="skip">Skip this question</button>`:""}
  </div>`;
}

function renderEnd(){
  const ps=state.players.slice().sort((a,b)=>b.score-a.score);
  const top=ps[0].score, winners=ps.filter(p=>p.score===top);
  const head=state.players.length===1?`Well played, ${esc(ps[0].name)}!`:winners.length===1?`${winners[0].av} ${esc(winners[0].name)} wins!`:"It's a draw!";
  let place=0,last=null;
  $app.innerHTML=`
  <div class="trophy" aria-hidden="true">🏆</div>
  <h1 class="endh">${head}</h1>
  <p class="note" style="text-align:center">${state.total} questions played.</p>
  <div class="podium">${ps.map((p,i)=>{ if(p.score!==last){place=i+1;last=p.score;}
    return `<div class="rank ${place===1?"first":""}"><span class="pos">${place}</span><span class="a" aria-hidden="true">${p.av}</span>
      <div><div class="nm">${esc(p.name)}</div><div class="st">${p.score} of ${p.answered} right · best run ${p.best}</div></div>
      <span class="pts" aria-label="${p.score} points">${p.score}</span></div>`;}).join("")}</div>
  <div class="rowbtns"><button class="btn btn-main" data-a="again">Play again</button><button class="btn btn-ghost" data-a="setup">Change players</button></div>`;
}

/* ---------- Events ---------- */
$app.addEventListener("input",e=>{
  const t=e.target; if(!t.dataset.k) return;
  const i=+t.dataset.i;
  if(t.dataset.k==="age"){t.value=t.value.replace(/\D/g,"");setup.players[i].age=t.value?+t.value:"";}
  else setup.players[i].name=t.value;
  saveSetup();
  const m=document.getElementById("mins"); if(m) m.textContent=minutesNote();
});
let quitTimer=null;
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a;
  if(a!=="quit"&&ui.quitArm){ui.quitArm=false;}
  switch(a){
    case "add": setup.players.push({name:"",age:"",av:freeAvatar(-1)}); saveSetup(); render(); document.getElementById(`name-${setup.players.length-1}`)?.focus(); break;
    case "rm": setup.players.splice(+b.dataset.i,1); ui.pickFor=null; saveSetup(); render(); break;
    case "pickav": {const i=+b.dataset.i; ui.pickFor=ui.pickFor===i?null:i; render(); break;}
    case "setav": {const i=+b.dataset.i; setup.players[i].av=b.dataset.v; ui.pickFor=null; saveSetup(); Sfx.pop(); render();
      document.querySelector(`.av[data-i="${i}"]`)?.focus(); break;}
    case "cat": {const c=b.dataset.c; setup.cats=setup.cats.includes(c)?setup.cats.filter(x=>x!==c):[...setup.cats,c]; saveSetup(); render(); break;}
    case "per": setup.per=+b.dataset.v; saveSetup(); render(); break;
    case "voice": setup.voice=!setup.voice; saveSetup(); if(!setup.voice) Speech.stop(); render(); break;
    case "sound": setup.sound=!setup.sound; saveSetup(); Sfx.pop(); render(); break;
    case "resetseen": seen=new Set(); saveSeen(); b.textContent="Done. Every question is back in the pot."; break;
    case "start": case "again": startGame(); break;
    case "setup": Speech.stop(); state=null; render(); window.scrollTo(0,0); break;
    case "say": readQuestion(); break;
    case "skip": nextQuestion(false,line("skip")); break;
    case "opt": {
      if(state.phase==="done") return;
      state.picked=+b.dataset.i; const right=state.opts[state.picked]===state.q.a;
      state.phase="done"; const streak=score(right), vars={name:cur().name,a:state.q.a};
      state.feedback=line(right?"right":"wrong",vars); render(); if(!right) Fx.shake();
      Speech.say([state.feedback,streak?line("streak",{n:streak}):null],650);
      break;}
    case "next": advance(); break;
    case "reveal": state.phase="revealed"; Sfx.pop(); render(); Speech.say([line("reveal",{a:state.q.a})]); break;
    case "judge": {const ok=b.dataset.v==="1"; const name=cur().name; const streak=score(ok);
      const said=[line(ok?"judgeRight":"judgeWrong",{name}),streak?line("streak",{n:streak}):""].filter(Boolean).join(" ");
      advance(said,700); break;}
    case "quit":
      if(!ui.quitArm){ui.quitArm=true;render();clearTimeout(quitTimer);quitTimer=setTimeout(()=>{if(ui.quitArm){ui.quitArm=false;if(state&&state.screen==="play")render();}},3000);}
      else {ui.quitArm=false;Speech.stop();if(state.turn>0){state.total=state.turn;endGame();}else{state=null;render();}}
      break;
  }
});

/* ---------- Boot ---------- */
Speech.init();
window.claude?.hot?.snapshot?.(()=>({state,setup}));
function boot(data){ if(data&&data.setup) setup=data.setup; if(data&&data.state) state=data.state; normalizeSetup(); saveSetup(); render(); }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
